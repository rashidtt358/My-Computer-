<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="desktop">
        <!-- ഐക്കണുകൾ -->
        <div class="icon" onclick="openApp('myfiles-window')" style="top: 20px;">
            📁 <br> My Files
        </div>
        <div class="icon" onclick="openApp('notepad-window')" style="top: 100px;">
            📝 <br> Notepad
        </div>
        
        <!-- My Files വിൻഡോ -->
        <div id="myfiles-window" class="app-window hidden">
            <div class="window-header">
                📁 My Files
                <button onclick="closeApp('myfiles-window')">X</button>
            </div>
            <div class="window-content">
                <p>Welcome to My Files!</p>
                <p>📄 document.txt</p>
                <p>🖼️ image.png</p>
            </div>
        </div>

        <!-- Notepad വിൻഡോ -->
        <div id="notepad-window" class="app-window hidden">
            <div class="window-header">
                📝 Notepad
                <button onclick="closeApp('notepad-window')">X</button>
            </div>
            <div class="window-content" style="padding: 0;">
                <textarea placeholder="ഇവിടെ ടൈപ്പ് ചെയ്യാം..."></textarea>
            </div>
        </div>
    </div>

    <!-- സ്റ്റാർട്ട് മെനു -->
    <div id="start-menu" class="hidden">
        <ul>
            <li>⚙️ Settings</li>
            <li>🌐 Browser</li>
            <li onclick="alert('Shutting Down...')">🔴 Shut Down</li>
        </ul>
    </div>

    <!-- ടാസ്ക്ബാർ -->
    <div id="taskbar">
        <button id="start-btn" onclick="toggleStartMenu()">Start</button>
        <span id="clock"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
